[package]
name = "koopman-snn-lm"
version = "0.0.0"
edition = "2021"
# Inherited floor: kdmd-snn -> koopman-dmd -> faer requires 1.85.
rust-version = "1.85"
description = "Next-token language modelling with Koopman-DMD spiking neural networks"
license = "MIT"
publish = false

[dependencies]
# Pinned revision of the kdmd-snn crate. Changes the crate itself needs
# (per-step readout, checkpoint/resume) go upstream into that repository,
# then this revision is bumped in a commit of its own. For local work against
# an unpublished crate change, use an uncommitted [patch] override.
kdmd-snn = { git = "https://github.com/jimeharrisjr/koopman-based-SNN.git", rev = "e8480f5f7b3ee6e45cec9227d14443b873e69759" }
# Must track kdmd-snn's faer minor version exactly: Mat<f64> crosses the API.
faer = "0.22"
