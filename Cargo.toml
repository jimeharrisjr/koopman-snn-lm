[package]
name = "koopman-snn-lm"
version = "0.0.0"
edition = "2021"
# Inherited floor: kdmd-snn -> koopman-dmd -> faer requires 1.85.
rust-version = "1.85"
description = "Next-token language modelling with Koopman-DMD spiking neural networks"
license = "MIT"
publish = false

[dependencies]
# Local sibling checkout of github.com/jimeharrisjr/koopman-based-SNN.
# Changes the crate itself needs (per-step readout, checkpoint/resume) go
# upstream into that repository, not here. Before any registered run this
# must become a pinned git revision so the run is reproducible.
kdmd-snn = { path = "../kdmd-SNN/crates/kdmd-snn" }
# Must track kdmd-snn's faer minor version exactly: Mat<f64> crosses the API.
faer = "0.22"
